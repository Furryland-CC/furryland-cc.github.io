name: Sync Excel Website Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Excel reader
        run: pip install openpyxl

      - name: Download latest Masterkey
        env:
          EXCEL_URL: ${{ secrets.EXCEL_DOWNLOAD_URL }}
        run: |
          curl -L --fail --retry 3 "$EXCEL_URL" -o masterkey.xlsx

      - name: Convert Excel to website data
        run: |
          python <<'PY'
          import json
          import re
          import openpyxl

          wb = openpyxl.load_workbook(
              "masterkey.xlsx",
              data_only=True,
              read_only=True
          )

          ws = wb["Zip Code Info"]

          locations = []

          for row in ws.iter_rows(values_only=True):
              values = list(row) + [None] * 5
              name, moego, phone, timezone, zip_codes = values[:5]

              if not name or not zip_codes:
                  continue

              locations.append({
                  "name": re.sub(r"\s+", " ", str(name)).strip(),
                  "moego": str(moego or "").strip(),
                  "phone": str(phone or "").strip(),
                  "timezone": str(timezone or "").strip(),
                  "zips": [
                      z.strip()
                      for z in str(zip_codes).split(",")
                      if z.strip()
                  ]
              })

          breed_sheet = wb["Breed Guide"]

          all_breeds = []
          double_breeds = []

          for row in breed_sheet.iter_rows(values_only=True):
              values = list(row) + [None, None]

              breed = str(values[0] or "").strip()
              double_breed = str(values[1] or "").strip()

              if breed and breed.lower() not in {
                  "breed",
                  "all breeds"
              }:
                  all_breeds.append(breed)

              if double_breed and double_breed.lower() not in {
                  "double coated",
                  "double-coated",
                  "double coated breeds"
              }:
                  double_breeds.append(double_breed)

          data = {
              "locations": locations,
              "allBreeds": all_breeds,
              "doubleBreeds": double_breeds
          }

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, separators=(",", ":"))

          print(f"Exported {len(locations)} locations.")
          print(f"Exported {len(all_breeds)} breeds.")
          print(f"Exported {len(double_breeds)} double-coated breeds.")
          PY

      - name: Publish updated data
        run: |
          git config user.name "FurryLand Data Sync"
          git config user.email "actions@github.com"
          git add data.json

          if git diff --cached --quiet; then
            echo "No Excel changes detected."
            exit 0
          fi

          git commit -m "Update website data from Excel"
          git push
